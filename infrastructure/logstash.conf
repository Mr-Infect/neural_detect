input {
  beats { port => 5044 }
}
filter {
  if [message] and ![event][original] {
    mutate { copy => { "message" => "[event][original]" } }
  }
  mutate {
    add_field => {
      "[observer][type]" => "logstash"
      "[observer][vendor]" => "Elastic"
    }
  }
}
output {
  if "authentication" in [event][category] {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "neural-detect-%{+YYYY.MM.dd}" pipeline => "neural-detect-auth" }
  } else if "process" in [event][category] {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "neural-detect-%{+YYYY.MM.dd}" pipeline => "neural-detect-process" }
  } else if "network" in [event][category] and [dns] {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "neural-detect-%{+YYYY.MM.dd}" pipeline => "neural-detect-dns" }
  } else if "network" in [event][category] {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "neural-detect-%{+YYYY.MM.dd}" pipeline => "neural-detect-network" }
  } else if [event][kind] == "alert" {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "neural-detect-%{+YYYY.MM.dd}" pipeline => "neural-detect-endpoint-alert" }
  } else {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "neural-detect-%{+YYYY.MM.dd}" }
  }
}
