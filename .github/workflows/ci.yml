name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock -e ".[dev]"
      - run: ruff check apps ai_engine ai_security core detection_engine integrations scripts tests
      - run: pytest -q
      - run: python -m scripts.validate_detections
      # PYSEC-2026-2447: diskcache 5.6.3 (transitive via pySigma) has no fixed release yet.
      # Ignored explicitly so any *new* advisory still fails CI. Remove once diskcache publishes a fix.
      - run: pip-audit --strict --ignore-vuln PYSEC-2026-2447 -r requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/frontend
      - run: npm audit --audit-level=high
        working-directory: apps/frontend
      - run: npm run build
        working-directory: apps/frontend
      # .env is git-ignored by design; validate the compose files against the template.
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f infrastructure/docker-compose.prod.yml config --quiet
