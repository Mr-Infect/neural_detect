name: Release images and SBOMs
on:
  release:
    types: [published]
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require release metadata
        run: |
          test -f LICENSE || { echo "A project license must be selected before publishing an open-source release." >&2; exit 1; }
          test -f CHANGELOG.md
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image names
        id: image
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build and publish API image with SBOM
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/neural-detect-api:${{ steps.image.outputs.tag }}
          sbom: true
          provenance: true
      - name: Build and publish frontend image with SBOM
        uses: docker/build-push-action@v6.19.2
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/neural-detect-frontend:${{ steps.image.outputs.tag }}
          sbom: true
          provenance: true
      - name: Scan API image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ghcr.io/${{ steps.image.outputs.owner }}/neural-detect-api:${{ steps.image.outputs.tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ghcr.io/${{ steps.image.outputs.owner }}/neural-detect-frontend:${{ steps.image.outputs.tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
