name: neural-detect
services:
  postgres:
    image: postgres:17.2
    env_file: [.env]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U neural -d neural_detect"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server","--appendonly","yes"]
    volumes: [redis_data:/data]
  qdrant:
    image: qdrant/qdrant:v1.13.2
    volumes: [qdrant_data:/qdrant/storage]
    ports: ["6333:6333"]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.1
    environment:
      discovery.type: single-node
      # Security must be on: Kibana's detection engine needs it to show and run rules.
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ND_ELASTIC_PASSWORD:?Run ./scripts/setup.sh to generate ND_ELASTIC_PASSWORD}
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    volumes: [elasticsearch_data:/usr/share/elasticsearch/data]
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
  elasticsearch-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.1
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"
    environment:
      ELASTIC_PASSWORD: ${ND_ELASTIC_PASSWORD}
      KIBANA_SYSTEM_PASSWORD: ${ND_KIBANA_SYSTEM_PASSWORD:?Run ./scripts/setup.sh to generate ND_KIBANA_SYSTEM_PASSWORD}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        curl -fsS -u "elastic:$$ELASTIC_PASSWORD" -X POST -H "Content-Type: application/json"
        http://elasticsearch:9200/_security/user/kibana_system/_password
        -d "{\"password\":\"$$KIBANA_SYSTEM_PASSWORD\"}"
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.1
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${ND_KIBANA_SYSTEM_PASSWORD}
      # Kibana refuses to create detection rules without these keys. Generated into .env by scripts/setup.sh.
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${ND_KIBANA_ENCRYPTION_KEY:?Run ./scripts/setup.sh to generate ND_KIBANA_ENCRYPTION_KEY}
      XPACK_SECURITY_ENCRYPTIONKEY: ${ND_KIBANA_ENCRYPTION_KEY}
      XPACK_REPORTING_ENCRYPTIONKEY: ${ND_KIBANA_ENCRYPTION_KEY}
    depends_on:
      elasticsearch-setup:
        condition: service_completed_successfully
    ports: ["5601:5601"]
  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.1
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ND_ELASTIC_PASSWORD: ${ND_ELASTIC_PASSWORD}
    volumes: ["./infrastructure/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro"]
    ports: ["5044:5044","9600:9600"]
  opa:
    image: openpolicyagent/opa:1.0.0
    command: ["run","--server","--addr=0.0.0.0:8181","/policy/neural_detect.rego"]
    volumes: ["./core/policy_engine/neural_detect.rego:/policy/neural_detect.rego:ro"]
    ports: ["8181:8181"]
  api:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    env_file: [.env]
    depends_on:
      postgres:
        condition: service_healthy
      ollama-relay:
        condition: service_started
      opa:
        condition: service_started
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8001:8000"]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/api/v1/health\",timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
  ollama-relay:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    network_mode: host
    command: ["python","-m","apps.api.ollama_relay"]
    restart: unless-stopped
  worker:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    command: ["python","-m","apps.worker.worker"]
    env_file: [.env]
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
  frontend:
    build: {context: ./apps/frontend, dockerfile: Dockerfile}
    ports: ["5173:5173"]
    depends_on: [api]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./infrastructure/otel-collector.yml:/etc/otelcol/config.yaml:ro"]
    ports: ["4317:4317","4318:4318"]
  ollama:
    image: ollama/ollama:0.5.7
    profiles: ["local-ai"]
    volumes: [ollama_data:/root/.ollama]
    ports: ["11434:11434"]
volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  elasticsearch_data:
  ollama_data:





