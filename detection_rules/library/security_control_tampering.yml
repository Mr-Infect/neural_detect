title: Windows Security Control Tampering
id: 32f59121-8ad8-4a0d-917c-b213445e8f08
status: experimental
description: Detects commands that weaken Microsoft Defender or stop its service.
author: NEURAL DETECT
date: 2026/11/02
references: []
tags:
  - attack.defense_evasion
  - attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_defender:
    process.command_line|contains:
      - DisableRealtimeMonitoring
      - Set-MpPreference
  selection_service:
    process.command_line|contains:
      - "stop WinDefend"
      - "sc.exe stop"
  condition: selection_defender or selection_service
falsepositives:
  - Endpoint maintenance performed by authorized administrators.
level: high