title: LSASS Credential Dumping Indicator
id: 32f59121-8ad8-4a0d-917c-b213445e8f05
status: experimental
description: Detects processes requesting access to LSASS memory through common dump utilities.
author: NEURAL DETECT
date: 2026/11/02
references: []
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_target:
    process.command_line|contains: lsass
  selection_tool:
    process.name:
      - procdump.exe
      - rundll32.exe
  condition: selection_target and selection_tool
falsepositives:
  - Authorized endpoint diagnostics that inspect LSASS.
level: critical