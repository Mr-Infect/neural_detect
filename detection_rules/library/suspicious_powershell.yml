title: Suspicious PowerShell Encoded Command
id: 32f59121-8ad8-4a0d-917c-b213445e8f02
status: experimental
description: Detects PowerShell launched with an encoded command argument.
author: NEURAL DETECT
date: 2026/11/02
references: []
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    process.name:
      - powershell.exe
      - pwsh.exe
  selection_encoded:
    process.command_line|contains:
      - " -enc "
      - " -encodedcommand "
  condition: selection_image and selection_encoded
falsepositives:
  - Administrator scripts that intentionally use encoded PowerShell.
level: high